<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} | INRealty</title>
  <style>
    :root{--bg:#f7f8fa;--surface:#fff;--ink:#111827;--muted:#64748b;--line:#e5e7eb;--navy:#101b2d;--blue:#1f5eff;--max:920px}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.75}a{color:inherit;text-decoration:none}.wrap{width:min(calc(100% - 32px),var(--max));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{height:72px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;letter-spacing:.08em}.back{font-size:.92rem;color:var(--muted)}main{padding:52px 0 80px}.article{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:48px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef4ff;color:var(--blue);font-size:.8rem;font-weight:800;margin-bottom:16px}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.15;letter-spacing:-.04em;margin:0 0 14px}.meta{color:var(--muted);margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--line)}.article h2{margin-top:38px}.article p{margin:16px 0}.article img{max-width:100%;border-radius:18px}.article blockquote{margin:24px 0;padding:16px 20px;border-left:4px solid var(--blue);background:#f8fafc;color:#475569}.foot{margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}@media(max-width:640px){.article{padding:26px}.topin{height:64px}}
  </style>
</head>
<body>
<header class="top"><div class="wrap topin"><a class="logo" href="{{ '/preview/' | relative_url }}">INREALTY</a>{% if page.category == 'track-record' %}<a class="back" href="{{ '/preview/track-record/' | relative_url }}">← Track Record</a>{% else %}<a class="back" href="{{ '/preview/insights/' | relative_url }}">← Insights</a>{% endif %}</div></header>
<main><div class="wrap"><article class="article"><span class="tag">{{ page.label | default: page.category }}</span><h1>{{ page.title }}</h1><div class="meta">{% if page.project_year %}{{ page.project_year }} · {% endif %}{{ page.date | date: '%Y.%m.%d' }}</div>{{ content }}<div class="foot"><a href="{{ '/preview/' | relative_url }}">INRealty 홈페이지로 돌아가기 →</a></div></article></div></main>
</body>
</html>
